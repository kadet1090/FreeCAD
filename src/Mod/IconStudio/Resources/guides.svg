<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icon Studio keyline overlay. 24x24 unit space (1 unit = 1 px).

  The four keylines enclose the same optical area (18*18 = pi*10^2 = 16*20 =
  320 px^2), which is the target Fitting.py normalises unclassifiable shapes to.
  Colour-coded rather than black: the panel previews against a dark background.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <path id="trim" fill="#e8443a" fill-opacity="0.10" fill-rule="evenodd"
        d="M0,0H24V24H0Z M2,2V22H22V2Z"/>
  <g id="live-area" stroke="#e8443a" stroke-width="0.09" fill="none">
    <rect x="2" y="2" width="20" height="20"/>
  </g>
  <g id="keylines" stroke="#2e6fd9" stroke-width="0.09" fill="none">
    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
    <rect x="4" y="2" width="16" height="20" rx="2" ry="2"/>
    <rect x="2" y="4" width="20" height="16" rx="2" ry="2"/>
    <circle cx="12" cy="12" r="10"/>
  </g>
  <g id="axes" stroke="#9a968d" stroke-width="0.06" fill="none">
    <line x1="12" y1="0" x2="12" y2="24"/>
    <line x1="0" y1="12" x2="24" y2="12"/>
  </g>
  <g id="diagonals" stroke="#c46fd0" stroke-width="0.05" fill="none">
    <line x1="0" y1="0" x2="24" y2="24"/>
    <line x1="24" y1="0" x2="0" y2="24"/>
  </g>
</svg>
