---
Colors:
  white: "#ffffff"
  black: "#000000"
  transparent: "opacity(#ffffff, 0%)"

BaseShades:
  050: 0.05
  100: 0.10
  200: 0.20
  300: 0.30
  400: 0.40
  500: 0.50
  600: 0.60
  700: 0.70
  800: 0.80
  900: 0.90

BaseRadius:
  small: 2px
  medium: 3px
  large: 4px
  full: 100px

BaseSpacing: 4px
SpacingFactors:
  000: 0.0
  025: 0.25
  050: 0.5
  075: 0.75
  100: 1.0
  150: 1.5
  200: 2.0
  250: 2.5
  300: 3.0
  400: 4.0
  500: 5.0
  600: 6.0
  800: 8.0
  1000: 10.0
  1200: 12.0
  1600: 16.0

Spacing: "@BaseSpacing * @SpacingFactors"

BaseNeutral: "#adb5bd"
BaseContrast: "#495057"

Neutral: "shades(@BaseNeutral, (000: 0.00, 150: 0.15, 250: 0.25, 350: 0.35, 450: 0.45, 550: 0.55, 650: 0.65, 750: 0.75, 850: 0.85, 950: 0.95) + @BaseShades, range: 0.6, max: 1.0, q: 1.0)"
Contrast: "shades(@BaseContrast, @BaseShades, range: 0.6, q: 1.0)"

Green: "shades(#51cf66, @BaseShades)"
Red: "shades(#e01b24, @BaseShades)"
Yellow: "shades(#fcc419, @BaseShades)"
Blue: "shades(#418fde, @BaseShades)"
Purple: "shades(#845ef7, @BaseShades)"
Orange: "shades(#ff922b, @BaseShades)"
Accent: "shades(@ThemeAccentColor1, @BaseShades)"

Background:
  000: "@Neutral.000"
  050: "@Neutral.050"
  100: "@Neutral.100"
  150: "@Neutral.150"
  200: "@Neutral.200"

BaseTextColor: "@Contrast.900"

WarningColor: "@Orange.700"
NegativeColor: "@Red.700"
PositiveColor: "@Green.800"

AxisXColor: "@Red.700"
AxisYColor: "@Green.700"
AxisZColor: "@Blue.700"
