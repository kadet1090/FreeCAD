_inherits:
  - FreeCAD Base.yaml

# The whole dark theme is these five statements. Both scales are re-anchored: Neutral runs
# dark-to-light from a dark base, and Contrast.900 - which BaseTextColor reads - becomes
# near-white from a light one.
BaseNeutral: "#343a40"
BaseContrast: "#f1f3f5"

# Base maps Background.000-200 onto the light end of the Neutral scale. Dark flips that to the
# dark end, so every surface built from a Background step - inputs, panels, hover states -
# lands in the range the theme expects without being named individually.
Background:
  000: "@Neutral.900"
  050: "@Neutral.850"
  100: "@Neutral.800"
  150: "@Neutral.750"
  200: "@Neutral.700"

BaseTextColor: "@Contrast.400"

# A button stands off a dark surface by being lighter than it, so it is built from the Neutral
# scale directly rather than from the Background steps the light theme reads.
ButtonBackground: "linear_gradient(x1: 0, y1: 0, x2: 0, y2: 1, @Neutral.300, @Neutral.400)"

# On a dark surface, hover has to brighten a border rather than darken it.
BaseHoveredBorderColorEffect: "effect(lighten: 0.08)"

SketcherConflictingConstraintsColor: "#fc6c6c"
SketcherEmptySketchColor: "#ffffff"
SketcherFullyConstrainedColor: "#8cff5b"
SketcherMalformedConstraintsColor: "#fc6c6c"
SketcherPartiallyRedundantConstraintsColor: "#77cbff"
SketcherRedundantConstraintsColor: "#ffa256"
SketcherSolverFailedColor: "#ff9090"
SketcherUnderConstrainedColor: "#ffffff"
