---
# "@Name" inside an expression is a flat parameter lookup: it finds a parameter literally
# named "Name" or nothing at all. It is NOT a component-chain lookup. FreeCADStyle walks
# Button → FormControl when a widget asks for a Height, but that walk happens at draw time
# and the expression evaluator has no part in it — so "@ButtonHeight" here resolves to the
# literal string "@ButtonHeight", which is an engaged value that stops the chain walk dead
# and silently disables the property. Always reference the concrete parameter that exists
# (here: "@FormControlHeight").

# Semantic surface tokens; these drive QPalette.
# Window / panel backgrounds
BaseWindowBackground: "@Background.050"
BaseAlternateBackground: "@Background.100"
BaseInputBackground: "@Background.000"

# Selection
BaseHighlightBackground: "@Accent.500"
BaseHighlightTextColor: "@Neutral.000"

# Disabled
BaseDisabledTextColor: "@Contrast.300"
BaseDisabledBackground: "@Neutral.200"

# Placeholder text in inputs
BasePlaceholderTextColor: "@Contrast.400"

# Links / URLs
BaseLinkColor: "@Accent.600"

# 3D shading (QPalette Light / Midlight / Mid / Dark / Shadow)
BaseShadingLight: "@Neutral.100"
BaseShadingMidlight: "@Neutral.200"
BaseShadingMid: "@Neutral.400"
BaseShadingDark: "@Neutral.600"
BaseShadingShadow: "@Neutral.800"

BaseBorderColor: "@Neutral.400"
BaseHoveredBorderColorEffect: "effect(darken: 0.08)"

FormControlSmallHeight: 24px
FormControlHeight: 26px
FormControlBigHeight: 30px

FormControlIconSpacing: "@Spacing.150"

FormControlPadding: "padding(horizontal: @Spacing.100, vertical: @Spacing.075)"
FormControlBorderThickness: 1px
FormControlBorderRadius: "@BaseRadius.medium"
FormControlBorderColor: "@BaseBorderColor"
FormControlTextColor: "@BaseTextColor"

ButtonBackground: "linear_gradient(x1: 0, y1: 0, x2: 0, y2: 1, @Background.100, @Background.200)"
ButtonMinWidth: 100px
ButtonPadding: "padding(horizontal: @Spacing.300, vertical: @Spacing.100)"

ButtonIconSpacing: "@FormControlIconSpacing"
ButtonIconSize: 16px

# Read by the QSS below rather than by resolveFont: Qt gives a tool button its font
# before the style is consulted, so the label is already measured by the time a
# FontSize token could reach it.
ButtonFontSize: 12px
ButtonFontWeight: 500
ButtonSmallFontSize: 11px
ButtonSmallFontWeight: 500
ButtonContentBox: "content_box((width: @ButtonMinWidth, height: @FormControlHeight), @ButtonPadding, @FormControlBorderThickness)"

ButtonFocusedBorderColor: "@Accent.600"
ButtonPrimaryFocusedBorderColor: "@ButtonFocusedBorderColor"

ButtonTextColor: "@BaseTextColor"
ButtonBorderColor: "@BaseBorderColor"

ButtonHoveredBackgroundEffect: "effect(lighten: 0.035)"
ButtonPressedBackgroundEffect: "effect(darken: 0.04)"
ButtonCheckedBackgroundEffect: "effect(darken: 0.03)"

ButtonPressedInnerShadow: "inner_shadow(color: rgba(0, 0, 0, 50), y: 2px, blur: 6px)"

ButtonCheckedInnerShadow: "@ButtonPressedInnerShadow"

ButtonDisabledBackground: "@BaseDisabledBackground"
ButtonDisabledTextColor: "@BaseDisabledTextColor"
ButtonDisabledBorderColor: "@BaseBorderColor"

ButtonPrimaryBackground: "blend(@ButtonBackground, @Accent.500, 15%)"
ButtonPrimaryBorderColor: "blend(@ButtonBorderColor, @Accent.500, 25%)"

ButtonLinkBackground: "@Colors.transparent"
ButtonLinkBorderColor: "@Colors.transparent"

ButtonLinkHoveredBackground: "@Background.100"
ButtonLinkHoveredBorderColor: "@BaseBorderColor"

ButtonLinkPressedBackground: "@Background.200"
ButtonLinkPressedBorderColor: "@BaseBorderColor"
ButtonLinkPressedInnerShadow: "@ButtonPressedInnerShadow"

ButtonLinkCheckedBackground: "@Background.150"
ButtonLinkCheckedBorderColor: "@BaseBorderColor"
ButtonLinkCheckedInnerShadow: "@ButtonCheckedInnerShadow"

ToolButtonPadding: "padding(@Spacing.150)"
ToolButtonSmallPadding: "padding(@Spacing.100)"

# A tool button is at least as wide as it is tall, so an icon-only one is never narrower than
# square. The floors are the form-control heights, which is what a tool button's own Height
# resolves to through Button -> FormControl.
ToolButtonMinWidth: "@FormControlHeight"
ToolButtonSmallMinWidth: "@FormControlSmallHeight"

# The Link variant covers auto-raise buttons. The padding is uniform, so an icon-only button
# grows squarely: size = iconSize + 2 * padding. That square only survives while
# iconSize + 2 * padding clears ToolButtonMinWidth; below an 18px icon the width floor wins
# and the button reads slightly wide.
ToolButtonLinkPadding: "@Spacing.100"
ToolButtonMenuWidth: 14px

ToolBarItemSpacing: "@Spacing.075"
ToolBarItemMargin: "@Spacing.050"

# A toolbar decides how tall its buttons are, so the form-control height a tool button would
# otherwise inherit is stopped here rather than overridden with a second number.
ToolBarButtonHeight: "reset()"

ToolBarBackground: "@Background.100"
ToolBarBorderColor: "@BaseBorderColor"
# Canonical North, i.e. the bottom edge; rotated for the other dock positions.
ToolBarBorderThickness: "border_thickness(0px, bottom: 1px)"

# A toolbar in the status bar or the menu bar corner blends into its host.
ToolBarTransparentBackground: "reset()"
ToolBarTransparentBorderColor: "reset()"

SeparatorThickness: 1px
SeparatorColor: "@BaseBorderColor"

# The two halves of a split button are painted as separate boxes, so the token system zeroes
# the corners where they meet and drops the trailing half's border there. FreeCADStyle needs
# to know nothing about SplitButton for this to work.
SplitButtonMainBorderRadius: "border_radius(@FormControlBorderRadius, right: 0px)"
SplitButtonMenuBorderRadius: "border_radius(@FormControlBorderRadius, left: 0px)"
SplitButtonMenuBorderThickness: "border_thickness(@FormControlBorderThickness, left: 0px)"

# The bar's own tokens drive its background and the separator between it and the content
# area below.
MenuBarBackground: "@BaseWindowBackground"
MenuBarPadding: "padding(horizontal: @Spacing.300, vertical: @Spacing.000)"
MenuBarBorderColor: "@BaseBorderColor"
MenuBarBorderThickness: "border_thickness(0px, bottom: 1px)"

MenuBarItemSpacing: "@Spacing.000"
MenuBarItemPadding: "padding(horizontal: @Spacing.200, vertical: @Spacing.050)"
MenuBarItemMargin: "padding(@Spacing.100)"
MenuBarItemBorderRadius: "@BaseRadius.small"
MenuBarItemTextColor: "@BaseTextColor"

MenuBarItemHoveredBackground: "@Background.200"
MenuBarItemHoveredTextColor: "@BaseTextColor"

MenuBarItemPressedBackground: "@Neutral.400"
MenuBarItemPressedInnerShadow: "@ButtonPressedInnerShadow"
MenuBarItemPressedTextColor: "@BaseTextColor"

MenuBarItemDisabledTextColor: "@BaseDisabledTextColor"

LineEditBackground: "@Background.000"
LineEditBorderColor: "@FormControlBorderColor"
LineEditBorderRadius: "@FormControlBorderRadius"
LineEditBorderThickness: "@FormControlBorderThickness"
LineEditPadding: "@FormControlPadding"
LineEditHeight: "@FormControlHeight"
LineEditSmallHeight: "@FormControlSmallHeight"

LineEditFocusedBorderColor: "@Accent.500"
LineEditHoveredBorderColorEffect: "@BaseHoveredBorderColorEffect"

LineEditDisabledBackground: "@BaseDisabledBackground"
LineEditDisabledTextColor: "@BaseDisabledTextColor"

TextEditPadding: "padding(@FormControlPadding.left)"

SelectPadding: "padding(horizontal: @Spacing.200, vertical: @Spacing.100)"
SelectSmallPadding: "@FormControlPadding"
SelectBigPadding: "@FormControlPadding"
